# DE RUTA en el servidor casero. Vive en /opt/deruta (el deploy copia este archivo en cada corrida).
# Los secretos están en /opt/deruta/.env, solo en el servidor. Ver deploy/README.md.
name: deruta

services:
  db:
    image: postgres:16-alpine
    container_name: deruta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: deruta
      POSTGRES_USER: deruta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deruta -d deruta"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deruta-api:local
    container_name: deruta-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      API_PREFIX: api/v1
      API_CORS_ORIGIN: ${WEB_URL:-https://deruta.duckdns.org}
      WEB_URL: ${WEB_URL:-https://deruta.duckdns.org}
      # Emails (códigos de verificación, avisos, recuperar contraseña).
      # Con EMAIL_PROVIDER=console los mails solo se imprimen en el log: nadie los recibe.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-DE RUTA <noreply@deruta.app>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      # SMS (verificación de teléfono). Con console, igual que el email.
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      DB_HOST: deruta-db
      DB_PORT: "5432"
      DB_USER: deruta
      DB_NAME: deruta
      DB_PASSWORD: ${DB_PASSWORD}
      # Sin migraciones todavía: TypeORM crea/actualiza las tablas al arrancar.
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      # Imágenes subidas: sin volumen se perdían en cada deploy (el contenedor se recrea).
      - uploads:/app/apps/api/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Cualquier respuesta HTTP (aunque sea 404) indica que la API está levantada.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 256m
    networks:
      internal: {}
      edge:
        aliases:
          - deruta-api

  web:
    image: nginx:alpine
    container_name: deruta-web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    networks:
      edge:
        aliases:
          - deruta-web

volumes:
  pgdata:
  uploads:

networks:
  internal:
  edge:
    external: true
    name: ahora-lo-reviso_alr-network
