# Sirve la web de Angular (SPA: todas las rutas caen en index.html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # JS y CSS llevan el hash en el nombre: se pueden cachear para siempre.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El resto (incluido index.html) no se cachea, así un deploy nuevo se ve enseguida.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
