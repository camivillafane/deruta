# Bloque de DE RUTA para el proxy compartido (ahora-lo-reviso-nginx-1, jonasal/nginx-certbot).
# Se instala A MANO en /opt/kioapp-develop/proxy/ (ver deploy/README.md): el deploy automático
# NO lo toca, porque un error acá tira abajo todas las apps del servidor.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deruta.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/deruta.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deruta.duckdns.org/privkey.pem;

    client_max_body_size 4m;

    # Resolver de Docker y upstreams en variables: si los contenedores de DE RUTA no existen,
    # nginx igual arranca (solo devuelve 502 acá) y no se caen las otras apps del proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $deruta_api http://deruta-api:3000;
    set $deruta_web http://deruta-web:80;

    # La API ya tiene el prefijo /api/v1: se pasa tal cual.
    location /api/ {
        proxy_pass $deruta_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass $deruta_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
