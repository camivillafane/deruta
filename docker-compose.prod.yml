# Configuración para VPS / producción.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# - Solo se expone Caddy (80/443). La base de datos y la API quedan en la red interna.
# - Caddy obtiene y renueva el certificado TLS automáticamente (requiere DOMAIN en .env
#   y que el DNS del dominio apunte a la IP del VPS).
services:
  db:
    ports: !reset []
    restart: always

  api:
    ports: !reset []
    restart: always

  web:
    ports: !reset []
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: deruta-caddy
    restart: always
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
